<a href="{% url url %}"
   class="group rounded-2xl border border-slate-100 dark:border-slate-700
          bg-white dark:bg-slate-800 shadow-sm
          hover:shadow-lg hover:border-{{ color }}-200 dark:hover:border-{{ color }}-700 transition
          p-5 flex flex-col gap-3">
  <div class="w-11 h-11 rounded-xl bg-{{ color }}-50 dark:bg-{{ color }}-900/30
              text-{{ color }}-600 dark:text-{{ color }}-400 flex items-center justify-center">
    <span class="material-icons">{{ icon }}</span>
  </div>
  <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{ title }}</h3>
  <p class="text-xs text-slate-500 dark:text-slate-400">{{ desc }}</p>
  <span class="mt-auto text-xs font-medium text-{{ color }}-600 dark:text-{{ color }}-400
               flex items-center gap-1">
    {{ cta }}
    <span class="material-icons text-sm group-hover:translate-x-0.5 transition">arrow_forward</span>
  </span>
</a>
